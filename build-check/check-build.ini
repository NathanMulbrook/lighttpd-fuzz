# Paths are relative to this file. Scan the matrix roots so newly added numeric
# variants are included automatically. Runtime data directories are excluded;
# they contain fuzzed, server-writable input rather than build artifacts.
[scan]
object_dirs =
    ../build
binary_paths =
    ../build
    ../run
exclude =
    ../build/src_*
    ../run/run_*/config
    ../run/run_*/share
    ../run/run_*/tmp
    ../run/run_*/www
    *fdevent_win32.o
    *fs_win32.o
    */lemon*

[checks]
stack_protector = present
fortify = absent
asan = present
ubsan = present
tsan = absent
msan = absent
sancov = present
sancov_cmp = present
sancov_pc_table = present
llvm_profile = present
source_coverage = present
libfuzzer = ignore

[checks:../build/build_*/src/t/test_common.o]
ubsan = ignore
sancov_cmp = ignore

[checks:../build/build_*/src/t/test_mod-test_mod.o]
ubsan = ignore
sancov_cmp = ignore

[checks:../build/build_*/src/lighttpd]
fortify = ignore
ubsan = ignore
sancov_cmp = ignore
msan = ignore
libfuzzer = present

[checks:../build/build_*/src/lighttpd-angel]
fortify = ignore
ubsan = ignore
sancov_cmp = ignore

[checks:../build/build_*/src/t/test_*]
fortify = ignore
ubsan = ignore
sancov_cmp = ignore
msan = ignore

[checks:../run/run_*/sbin/lighttpd]
fortify = ignore
ubsan = ignore
sancov_cmp = ignore
msan = ignore
libfuzzer = present

[checks:../run/run_*/sbin/lighttpd-angel]
fortify = ignore
ubsan = ignore
sancov_cmp = ignore

[output]
report = ../logs/symbolReport.md
